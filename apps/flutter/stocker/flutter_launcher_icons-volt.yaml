# Launcher icons for the VOLT flavour.
# Generate with:  dart run flutter_launcher_icons
# (picks up every flutter_launcher_icons-<flavor>.yaml in this directory)
#
# Android output -> android/app/src/volt/res/
# iOS output     -> ios/Runner/Assets.xcassets/AppIcon-volt.appiconset
#
# adaptive_icon_background is WHITE on purpose: the generated foreground PNG has
# an opaque white background (macOS `qlmanage` flattens SVG alpha, and no real
# rasterizer is installed). Because the Volt mark's own negative space is white,
# a white background layer renders identically to a transparent foreground under
# every Android mask. See assets/volt/README.md for the full explanation and how
# to switch to a truly transparent foreground later.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/volt/icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/volt/adaptive_icon_foreground.png"
