<!-- Launcher icon source: the brand mark on an opaque white square.

     Used for iOS and for the legacy (pre-API-26) Android launcher icon, both of
     which are shown full-bleed with only the system's rounding applied — so the
     padding has to be baked in here.

     The mark is 368 units wide; the canvas is expanded to 594 so the mark is
     368/594 = 62% of the icon, leaving a white margin around it. The white rect
     is drawn across the whole expanded viewBox so the added margin is white
     rather than transparent. -->
<svg width="512" height="512" viewBox="-41 -41 594 594" fill="none" xmlns="http://www.w3.org/2000/svg">
<rect x="-41" y="-41" width="594" height="594" fill="white"/>
