<!-- Android adaptive-icon FOREGROUND.

     Sizing maths (all in adaptive-icon dp):
       · foreground canvas is 108dp
       · the launcher only ever shows the centre 72dp (108 - 18 either side);
         the rest is reserve for masking + parallax
       · so content scaled to X% of this canvas renders at X/66.7% of what the
         user actually sees

     The brand mark is 368 units wide (it spans 72..440 of the original 512 box).
     Canvas is expanded to 800 units so the mark is 368/800 = 46% of the canvas,
     which lands at 368/533 = ~69% of the visible 72dp area — comfortable
     breathing room inside every mask (circle, squircle, rounded square).

     An earlier version used a 588 canvas (63% of canvas => ~94% of the VISIBLE
     area), which is why the mark appeared edge-to-edge on the home screen.

     Centre check: -144 + 800/2 = 256, matching the mark's centre. Background is
     intentionally absent — the background layer is supplied by
     `adaptive_icon_background` in flutter_launcher_icons-volt.yaml. -->
<svg width="512" height="512" viewBox="-144 -144 800 800" fill="none" xmlns="http://www.w3.org/2000/svg">
<path d="M256 72C357.62 72 440 154.38 440 256C440 357.62 357.62 440 256 440C154.38 440 72 357.62 72 256C72 154.38 154.38 72 256 72ZM259.9 74.0527C243.046 131.267 234 191.827 234 254.5C234 318.188 243.342 379.695 260.726 437.726C279.012 346.597 348.59 274.013 438.064 251.369C350.389 230.379 281.297 161.57 259.9 74.0527Z" fill="#4E75FF"/>
</svg>
