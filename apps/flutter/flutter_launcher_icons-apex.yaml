# Launcher icons for the APEX flavour.
# Generate with:  dart run flutter_launcher_icons
# (picks up every flutter_launcher_icons-<flavor>.yaml in this directory)
#
# Android output -> android/app/src/apex/res/
# iOS output     -> ios/Runner/Assets.xcassets/AppIcon-apex.appiconset
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/new_app_icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/adaptive_icon_foreground.png"
