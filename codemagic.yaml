# Codemagic CI — iOS builds of the Flutter app (apps/flutter) → TestFlight.
#
# One-time setup in Codemagic (codemagic.io):
#   1. Add application → GitHub → Ishant3300/volt-project → "codemagic.yaml".
#   2. Team settings → Integrations → Developer Portal → connect an App Store
#      Connect API key (App Store Connect → Users and Access → Integrations →
#      App Store Connect API, role App Manager). Name the integration exactly:
#         codemagic
#   3. Team settings → codemagic.yaml settings → Code signing identities:
#        - iOS certificates: "Generate certificate" (Apple Distribution) via the codemagic key
#        - iOS provisioning profiles: "Fetch profiles" → App Store profile for
#          com.voltlive.volt
#   4. Edit APP_STORE_APPLE_ID below to the app's Apple ID (App Store Connect →
#      VOLT → App Information → General Information → Apple ID, a number).
#
# Start a build: Codemagic → volt-project → Start new build → workflow
# "iOS Volt → TestFlight" (any branch, normally main), or push to the
# `ios-release` branch.
#
# "iOS Volt → App Store review" (manual start only) builds the same ipa and
# submits it for App Store review: any submission already in review is
# cancelled first, and an approved version is NOT released automatically
# (release it by hand in App Store Connect). Apple's App Review messages
# can only be answered in App Store Connect itself.
#
# iOS builds are PRACTICE-ONLY (--dart-define=PRACTICE_ONLY=true, see
# apps/flutter/lib/config/practice_only.dart): practice-account login only; the
# admin / master screens and the live-server login are not compiled in (Apple
# rejected 1.0.51 (55) under guideline 2.5.19 for containing them). Android
# APKs are built by deploy/flutter-build-*.sh, without this flag.
workflows:
  ios-volt-testflight:
    name: iOS Volt → TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: apps/flutter
    integrations: &integrations
      app_store_connect: codemagic
    environment: &environment
      flutter: 3.47.2
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.voltlive.volt
      vars:
        APP_STORE_APPLE_ID: "6808212028" # VOLT - Learn & Practice
        BRAND: volt
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: ios-release
          include: true
      cancel_previous_builds: true
    scripts: &scripts
      - name: Flutter packages
        script: flutter pub get
      - name: CocoaPods
        script: |
          cd ios
          pod install --repo-update
      - name: Use App Store signing profiles
        script: xcode-project use-profiles
      - name: Build Volt ipa
        script: |
          # One above the latest TestFlight build, so an upload never clashes;
          # falls back to the pubspec build number if that lookup fails.
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo "")
          PUBSPEC_BUILD=$(grep '^version:' pubspec.yaml | sed -E 's/.*\+([0-9]+).*/\1/')
          if [ -n "$LATEST" ]; then BUILD_NUMBER=$((LATEST + 1)); else BUILD_NUMBER=$PUBSPEC_BUILD; fi
          if [ "$BUILD_NUMBER" -le "$PUBSPEC_BUILD" ]; then BUILD_NUMBER=$((PUBSPEC_BUILD)); fi
          echo "Build number: $BUILD_NUMBER"
          flutter build ipa --release \
            --flavor "$BRAND" \
            --dart-define=BRAND="$BRAND" \
            --dart-define=PRACTICE_ONLY=true \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts: &artifacts
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  ios-volt-appstore:
    name: iOS Volt → App Store review
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: apps/flutter
    integrations: *integrations
    environment: *environment
    scripts: *scripts
    artifacts: *artifacts
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: true
        cancel_previous_submissions: true
        # Every update goes live as soon as Apple approves it (user, 5 Nov 2026).
        release_type: AFTER_APPROVAL

  # ── VOLT LIVE: full app for INTERNAL TestFlight testers only ───────────────
  # Manual start only. The full Volt app (live login, admin / master screens) —
  # built WITHOUT PRACTICE_ONLY, like the Android APK — uploaded to App Store
  # Connect for INTERNAL TestFlight testers (members of the App Store Connect
  # team, max 100) and NEVER submitted for beta or App Store review: Apple
  # rejected 1.0.51 (55) under 2.5.19 / 5.6 for exactly this code, so these
  # builds must not be put up for review (the review workflows above build
  # their own practice-only ipa). Shares the app record and build-number
  # counter with the practice builds: in TestFlight, testers pick the build
  # by number.
  ios-volt-live-internal:
    name: iOS Volt LIVE → TestFlight (internal only)
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: apps/flutter
    integrations: *integrations
    environment: *environment
    scripts:
      - name: Flutter packages
        script: flutter pub get
      - name: CocoaPods
        script: |
          cd ios
          pod install --repo-update
      - name: Use App Store signing profiles
        script: xcode-project use-profiles
      - name: Build Volt LIVE ipa (no PRACTICE_ONLY)
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo "")
          PUBSPEC_BUILD=$(grep '^version:' pubspec.yaml | sed -E 's/.*\+([0-9]+).*/\1/')
          if [ -n "$LATEST" ]; then BUILD_NUMBER=$((LATEST + 1)); else BUILD_NUMBER=$PUBSPEC_BUILD; fi
          if [ "$BUILD_NUMBER" -le "$PUBSPEC_BUILD" ]; then BUILD_NUMBER=$((PUBSPEC_BUILD)); fi
          echo "Build number: $BUILD_NUMBER (LIVE, internal testers only — never submit for review)"
          flutter build ipa --release \
            --flavor "$BRAND" \
            --dart-define=BRAND="$BRAND" \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts: *artifacts
    publishing:
      app_store_connect:
        auth: integration
        # Upload only: internal testers get it after Apple's processing;
        # no beta review submission, no App Store submission.
        submit_to_testflight: false
        submit_to_app_store: false

  # ── VELO: iOS trading simulator on the new Apple developer account ─────────
  # Manual start only. Same app code with --dart-define=BRAND=velo and
  # PRACTICE_ONLY=true: it talks to the practice (simulation) server only. The
  # Volt flavour's Xcode configuration is reused; this workflow swaps in Velo's
  # bundle id, name and icon at build time (the repo's Volt files are unchanged).
  #
  # Apple account (since the app transfer, 5 Nov 2026): Ashwinkumar Doru, team
  # ZYUHWWGYT4 (was Flamingo Infotech 9BJHTUS4RG). App Apple ID 6826137877 and
  # bundle id com.velo.simulator moved with the app.
  #   1. Codemagic → Integrations → Developer Portal: the new account's App Store
  #      Connect API key is named exactly: VELO (key 23V8FZ4PTN).
  #   2. Code signing identities: certificate velo-distribution-ashwin + an App
  #      Store profile for com.velo.simulator under team ZYUHWWGYT4.
  ios-velo-testflight:
    name: iOS Velo (simulator) → TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: apps/flutter
    integrations:
      app_store_connect: VELO
    environment:
      flutter: 3.47.2
      xcode: latest
      cocoapods: default
      # Pinned by reference name (new Apple team ZYUHWWGYT4, 5 Nov 2026) — Flamingo's
      # old velo-distribution / velo-appstore are still stored in Codemagic.
      ios_signing:
        provisioning_profiles:
          - velo-appstore-ashwin
        certificates:
          - velo-distribution-ashwin
      vars:
        APP_STORE_APPLE_ID: "6826137877" # VELO Learn (team ZYUHWWGYT4 since 5 Nov 2026)
        VELO_BUNDLE_ID: com.velo.simulator
        BRAND: velo
    scripts:
      - name: Check setup
        script: |
          case "$VELO_BUNDLE_ID$APP_STORE_APPLE_ID" in
            *REPLACE*) echo "Set VELO_BUNDLE_ID / APP_STORE_APPLE_ID in codemagic.yaml first"; exit 1;;
          esac
      - name: Velo identity (bundle id, name, icon) for this build only
        script: |
          cat > ios/Flutter/brand-volt.xcconfig <<XC
          PRODUCT_BUNDLE_IDENTIFIER = $VELO_BUNDLE_ID
          APP_DISPLAY_NAME = VELO
          ASSETCATALOG_COMPILER_APPICON_NAME = AppIcon-velo
          XC
          cat ios/Flutter/brand-volt.xcconfig
      - name: Flutter packages
        script: flutter pub get
      - name: CocoaPods
        script: |
          cd ios
          pod install --repo-update
      - name: Use App Store signing profiles
        script: xcode-project use-profiles
      - name: Build Velo ipa
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo "")
          PUBSPEC_BUILD=$(grep '^version:' pubspec.yaml | sed -E 's/.*\+([0-9]+).*/\1/')
          if [ -n "$LATEST" ]; then BUILD_NUMBER=$((LATEST + 1)); else BUILD_NUMBER=$PUBSPEC_BUILD; fi
          echo "Build number: $BUILD_NUMBER"
          flutter build ipa --release \
            --flavor volt \
            --dart-define=BRAND=velo \
            --dart-define=PRACTICE_ONLY=true \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist
      - name: Safety gate — no live server in the binary
        script: |
          # Fails the build if the compiled Dart code can reach the live server
          # (only the practice server is allowed in the simulator).
          IPA=$(ls build/ios/ipa/*.ipa | head -1)
          rm -rf /tmp/ipa && mkdir -p /tmp/ipa && unzip -q "$IPA" -d /tmp/ipa
          BIN=$(ls -d /tmp/ipa/Payload/*.app)/Frameworks/App.framework/App
          FAIL=0
          LIVE=$(strings "$BIN" | grep -c 'apexlive-api\.mynpe\.in' || true)
          PRACTICE=$(strings "$BIN" | grep -c 'apexlive-api\.mynpe\.in/practice' || true)
          echo "server URLs: $LIVE (practice: $PRACTICE)"
          [ "$LIVE" -ne "$PRACTICE" ] && { echo "LIVE SERVER URL FOUND"; FAIL=1; }
          # /servers/search = the live login's server picker ('Select Server' is
          # also the Create Master form's label, so the endpoint is checked).
          for m in '/servers/search' 'apex_update.apk' '-version.json'; do
            n=$(strings "$BIN" | grep -cF -- "$m" || true)
            echo "$m: $n"; [ "$n" -ne 0 ] && FAIL=1
          done
          exit $FAIL
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  # ── VELO Learn on the LIVE server (after the licence) ─────────────────────
  # Manual start only, and only once the trading licence is in hand: the same
  # VELO app (bundle id, name, icon) built WITHOUT PRACTICE_ONLY, so it talks to
  # the LIVE server like Volt. It must go to Apple as a NEW REVIEWED version
  # with the licence attached — never switch VELO to live any other way (no
  # server-side switch: Apple 2.3.1 / 2.5.19, the Flamingo account is at risk).
  # Start it with the environment variable VELO_LIVE_LICENCE_CONFIRMED=yes,
  # otherwise the first step stops the build. Builds version VELO_VERSION
  # (default 1.0.55 — 1.0.54 is released) and submits it for App Store review,
  # released automatically once approved (see publishing). Before starting:
  # create that version in App Store Connect with What's New "Bug fixes and
  # performance improvements." — review notes stay exactly as they are.
  ios-velo-live-testflight:
    name: iOS Velo Learn (live server, after licence) → TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: apps/flutter
    integrations:
      app_store_connect: VELO
    environment: &velo_live_env
      flutter: 3.47.2
      xcode: latest
      cocoapods: default
      # Pinned by reference name (new Apple team ZYUHWWGYT4, 5 Nov 2026) — Flamingo's
      # old velo-distribution / velo-appstore are still stored in Codemagic.
      ios_signing:
        provisioning_profiles:
          - velo-appstore-ashwin
        certificates:
          - velo-distribution-ashwin
      vars:
        APP_STORE_APPLE_ID: "6826137877"
        VELO_BUNDLE_ID: com.velo.simulator
        BRAND: velo
        # Licence received and emailed to Apple (4 Nov 2026) — lets this build run.
        # Build-time switch only; nothing of it goes into the app or to Apple.
        VELO_LIVE_LICENCE_CONFIRMED: "yes"
    scripts: &velo_live_scripts
      - name: Licence confirmed?
        script: |
          if [ "${VELO_LIVE_LICENCE_CONFIRMED:-}" != "yes" ]; then
            echo "VELO live build needs the trading licence first. Start it with VELO_LIVE_LICENCE_CONFIRMED=yes."
            exit 1
          fi
      - name: Velo identity (bundle id, name, icon) for this build only
        script: |
          cat > ios/Flutter/brand-volt.xcconfig <<XC
          PRODUCT_BUNDLE_IDENTIFIER = $VELO_BUNDLE_ID
          APP_DISPLAY_NAME = VELO
          ASSETCATALOG_COMPILER_APPICON_NAME = AppIcon-velo
          XC
          cat ios/Flutter/brand-volt.xcconfig
      - name: Flutter packages
        script: flutter pub get
      - name: CocoaPods
        script: |
          cd ios
          pod install --repo-update
      - name: Use App Store signing profiles
        script: xcode-project use-profiles
      - name: Build Velo Learn ipa (live server)
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo "")
          PUBSPEC_BUILD=$(grep '^version:' pubspec.yaml | sed -E 's/.*\+([0-9]+).*/\1/')
          if [ -n "$LATEST" ]; then BUILD_NUMBER=$((LATEST + 1)); else BUILD_NUMBER=$PUBSPEC_BUILD; fi
          # Never below pubspec's build: the server lets equity accounts sign in only
          # from app builds >= cashEq:minAppBuild (57+), and VELO's TestFlight count is lower.
          if [ "$BUILD_NUMBER" -lt "$PUBSPEC_BUILD" ]; then BUILD_NUMBER=$PUBSPEC_BUILD; fi
          echo "Build number: $BUILD_NUMBER"
          flutter build ipa --release \
            --flavor volt \
            --dart-define=BRAND=velo \
            --build-name="${VELO_VERSION:-1.0.55}" \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist
      - name: Check — this really is the live build
        script: |
          IPA=$(ls build/ios/ipa/*.ipa | head -1)
          rm -rf /tmp/ipa && mkdir -p /tmp/ipa && unzip -q "$IPA" -d /tmp/ipa
          BIN=$(ls -d /tmp/ipa/Payload/*.app)/Frameworks/App.framework/App
          LIVE=$(strings "$BIN" | grep -c 'apexlive-api\.mynpe\.in' || true)
          PRACTICE=$(strings "$BIN" | grep -c 'apexlive-api\.mynpe\.in/practice' || true)
          echo "server URLs: $LIVE (practice: $PRACTICE)"
          [ "$LIVE" -gt "$PRACTICE" ] || { echo "NOT A LIVE BUILD"; exit 1; }
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Uploaded (internal TestFlight testers can install it) and submitted
        # for App Store review; released automatically once approved.
        submit_to_testflight: false
        submit_to_app_store: true
        cancel_previous_submissions: false
        # Every update goes live as soon as Apple approves it (user, 5 Nov 2026).
        release_type: AFTER_APPROVAL

  # Same live VELO Learn build, uploaded to App Store Connect / TestFlight ONLY —
  # nothing is sent to App Store review. Used to prove signing and upload work
  # on the new Apple team (5 Nov 2026); the build can later be picked for review.
  ios-velo-live-upload:
    name: iOS Velo Learn (live server) → upload only, no review
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: apps/flutter
    integrations:
      app_store_connect: VELO
    environment: *velo_live_env
    scripts: *velo_live_scripts
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
