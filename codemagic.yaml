# Codemagic CI — iOS builds of the Flutter app (apps/flutter) → TestFlight.
#
# One-time setup in Codemagic (codemagic.io):
#   1. Add application → GitHub → Ishant3300/volt-project → "codemagic.yaml".
#   2. Team settings → Integrations → Developer Portal → connect an App Store
#      Connect API key (App Store Connect → Users and Access → Integrations →
#      App Store Connect API, role App Manager). Name the integration exactly:
#         codemagic
#   3. Team settings → codemagic.yaml settings → Code signing identities:
#        - iOS certificates: "Generate certificate" (Apple Distribution) via the codemagic key
#        - iOS provisioning profiles: "Fetch profiles" → App Store profile for
#          com.voltlive.volt
#   4. Edit APP_STORE_APPLE_ID below to the app's Apple ID (App Store Connect →
#      VOLT → App Information → General Information → Apple ID, a number).
#
# Start a build: Codemagic → volt-project → Start new build → workflow
# "iOS Volt → TestFlight" (any branch, normally main), or push to the
# `ios-release` branch.
#
# "iOS Volt → App Store review" (manual start only) builds the same ipa and
# submits it for App Store review: any submission already in review is
# cancelled first, and an approved version is NOT released automatically
# (release it by hand in App Store Connect). Apple's App Review messages
# can only be answered in App Store Connect itself.
#
# iOS builds are PRACTICE-ONLY (--dart-define=PRACTICE_ONLY=true, see
# apps/flutter/lib/config/practice_only.dart): practice-account login only; the
# admin / master screens and the live-server login are not compiled in (Apple
# rejected 1.0.51 (55) under guideline 2.5.19 for containing them). Android
# APKs are built by deploy/flutter-build-*.sh, without this flag.
workflows:
  ios-volt-testflight:
    name: iOS Volt → TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: apps/flutter
    integrations: &integrations
      app_store_connect: codemagic
    environment: &environment
      flutter: 3.47.2
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.voltlive.volt
      vars:
        APP_STORE_APPLE_ID: "6808212028" # VOLT - Learn & Practice
        BRAND: volt
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: ios-release
          include: true
      cancel_previous_builds: true
    scripts: &scripts
      - name: Flutter packages
        script: flutter pub get
      - name: CocoaPods
        script: |
          cd ios
          pod install --repo-update
      - name: Use App Store signing profiles
        script: xcode-project use-profiles
      - name: Build Volt ipa
        script: |
          # One above the latest TestFlight build, so an upload never clashes;
          # falls back to the pubspec build number if that lookup fails.
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo "")
          PUBSPEC_BUILD=$(grep '^version:' pubspec.yaml | sed -E 's/.*\+([0-9]+).*/\1/')
          if [ -n "$LATEST" ]; then BUILD_NUMBER=$((LATEST + 1)); else BUILD_NUMBER=$PUBSPEC_BUILD; fi
          if [ "$BUILD_NUMBER" -le "$PUBSPEC_BUILD" ]; then BUILD_NUMBER=$((PUBSPEC_BUILD)); fi
          echo "Build number: $BUILD_NUMBER"
          flutter build ipa --release \
            --flavor "$BRAND" \
            --dart-define=BRAND="$BRAND" \
            --dart-define=PRACTICE_ONLY=true \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts: &artifacts
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  ios-volt-appstore:
    name: iOS Volt → App Store review
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: apps/flutter
    integrations: *integrations
    environment: *environment
    scripts: *scripts
    artifacts: *artifacts
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: true
        cancel_previous_submissions: true
        release_type: MANUAL

  # ── VELO: iOS trading simulator on the new Apple developer account ─────────
  # Manual start only. Same app code with --dart-define=BRAND=velo and
  # PRACTICE_ONLY=true: it talks to the practice (simulation) server only. The
  # Volt flavour's Xcode configuration is reused; this workflow swaps in Velo's
  # bundle id, name and icon at build time (the repo's Volt files are unchanged).
  #
  # Before the first run (new account):
  #   1. Codemagic → Team integrations → add the NEW account's App Store Connect
  #      API key, named exactly: velo
  #   2. Replace VELO_BUNDLE_ID / APP_STORE_APPLE_ID below (and bundle_identifier
  #      under ios_signing) with the new app's values.
  #   3. Code signing identities: certificate + App Store profile for that bundle id.
  ios-velo-testflight:
    name: iOS Velo (simulator) → TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: apps/flutter
    integrations:
      app_store_connect: velo
    environment:
      flutter: 3.47.2
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.REPLACE.velo
      vars:
        APP_STORE_APPLE_ID: "REPLACE"
        VELO_BUNDLE_ID: com.REPLACE.velo
        BRAND: velo
    scripts:
      - name: Check setup
        script: |
          case "$VELO_BUNDLE_ID$APP_STORE_APPLE_ID" in
            *REPLACE*) echo "Set VELO_BUNDLE_ID / APP_STORE_APPLE_ID in codemagic.yaml first"; exit 1;;
          esac
      - name: Velo identity (bundle id, name, icon) for this build only
        script: |
          cat > ios/Flutter/brand-volt.xcconfig <<XC
          PRODUCT_BUNDLE_IDENTIFIER = $VELO_BUNDLE_ID
          APP_DISPLAY_NAME = VELO
          ASSETCATALOG_COMPILER_APPICON_NAME = AppIcon-velo
          XC
          cat ios/Flutter/brand-volt.xcconfig
      - name: Flutter packages
        script: flutter pub get
      - name: CocoaPods
        script: |
          cd ios
          pod install --repo-update
      - name: Use App Store signing profiles
        script: xcode-project use-profiles
      - name: Build Velo ipa
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo "")
          PUBSPEC_BUILD=$(grep '^version:' pubspec.yaml | sed -E 's/.*\+([0-9]+).*/\1/')
          if [ -n "$LATEST" ]; then BUILD_NUMBER=$((LATEST + 1)); else BUILD_NUMBER=$PUBSPEC_BUILD; fi
          echo "Build number: $BUILD_NUMBER"
          flutter build ipa --release \
            --flavor volt \
            --dart-define=BRAND=velo \
            --dart-define=PRACTICE_ONLY=true \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist
      - name: Safety gate — no live server in the binary
        script: |
          # Fails the build if the compiled Dart code can reach the live server
          # (only the practice server is allowed in the simulator).
          IPA=$(ls build/ios/ipa/*.ipa | head -1)
          rm -rf /tmp/ipa && mkdir -p /tmp/ipa && unzip -q "$IPA" -d /tmp/ipa
          BIN=$(ls -d /tmp/ipa/Payload/*.app)/Frameworks/App.framework/App
          FAIL=0
          LIVE=$(strings "$BIN" | grep -c 'apexlive-api\.mynpe\.in' || true)
          PRACTICE=$(strings "$BIN" | grep -c 'apexlive-api\.mynpe\.in/practice' || true)
          echo "server URLs: $LIVE (practice: $PRACTICE)"
          [ "$LIVE" -ne "$PRACTICE" ] && { echo "LIVE SERVER URL FOUND"; FAIL=1; }
          for m in 'Select Server' '/servers/search' 'apex_update.apk' '-version.json'; do
            n=$(strings "$BIN" | grep -cF -- "$m" || true)
            echo "$m: $n"; [ "$n" -ne 0 ] && FAIL=1
          done
          exit $FAIL
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
